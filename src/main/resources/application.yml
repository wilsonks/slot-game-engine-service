server:
  port: 8084
spring:
  application:
    name: slot-game-engine-service
  config:
    import:
      - classpath:gamemath/reel1-strip.yml
      - classpath:gamemath/reel2-strip.yml
      - classpath:gamemath/reel3-strip.yml
      - classpath:gamemath/money-wheel.yml
      - classpath:gamemath/hit-or-miss.yml
      - classpath:gamemath/one-of-three.yml
      - classpath:gamemath/six-of-eighteen.yml
management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true
info:
  app:
    name: slot-game-engine-service
    description: Certified game math core
    version: 1.0.0
gaffing:
  enabled: false
paytable:
  bets-values: [1, 2, 3, 4, 5]
  denom-values: [1, 2, 5, 10, 20, 50, 100, 200, 500]
  default-bet-index: 0
  default-denom-index: 4
  bet-values:
    - [1, 2, 5, 10, 20, 50, 100, 200, 500]
    - [2, 4, 10, 20, 40, 100, 200, 400, 1000]
    - [3, 6, 15, 30, 60, 150, 300, 600, 1500]
    - [4, 8, 20, 40, 80, 200, 400, 800, 2000]
    - [5, 10, 25, 50, 100, 250, 500, 1000, 2500]
  jackpot-contribution-rate: 0.005
