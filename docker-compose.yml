version: '3.8'

services:
  game-engine:
    build: .
    container_name: slot-game-engine-service
    ports:
      - "8084:8084"
    environment:
      - GAFFING_ENABLED=false
      - SPRING_PROFILES_ACTIVE=prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
